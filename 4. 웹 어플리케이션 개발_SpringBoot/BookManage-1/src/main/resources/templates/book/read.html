<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<title>책 상세 페이지</title>
	</head>
	<body>
		<h1>책 상세</h1>
		<hr>
		
		제목:
		<span th:text="${rs.title}"></span>		<br>
		가격:
		<span th:text="${#numbers.formatInteger(rs.price, 3, 'COMMA')}"></span>원	<br>
		입력일시:
		<span th:text="${#temporals.format(rs.insertDateTime, 'yyyy-MM-dd HH:mm')}"></span>	<br>
		
		<!-- localhost:8080/book/delete/[책번호] 이동
			=> "Post방식으로 수행 방법" 주로 사용 -->
		<a th:href="@{/book/delete/{id}(id=${rs.bookId})}">삭제</a>	<br>
		
		<!-- localhost:8080/book/edit/[책번호] 이동-->
		<a th:href="@{/book/edit/{id}(id=${rs.bookId})}">수정</a>		<br>
		
		<!-- localhost:8080/book/list 이동 -->
		<a th:href="@{/book/list}">목록으로</a>
	</body>
</html>
