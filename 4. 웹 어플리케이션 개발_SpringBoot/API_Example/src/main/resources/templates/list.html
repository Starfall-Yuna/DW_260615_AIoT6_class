<html>
	<head>
		<title>오픈API 조회</title>
	</head>
	<body>
		<!-- localhost:8080/api 접속 -->
		<h1>대전 관광지 목록</h1>
		<button onclick="show()">목록 조회</button>
		<hr>
		
		<div id="rs"></div>
		
		<script>
			// "목록 조회" 클릭 -> 지정된 오픈API 내용을 형식에 맞추어 브라우저 표현
			function show(){
				alert("API 정보를 조회합니다.");
				
				// 1. 이벤트에 관여되는 요소 당겨오기
				rs = document.querySelector("#rs");
				
				// 2. url 변수값 구성
				url = 
					"https://apis.data.go.kr/6300000/openapi2022/tourspot" +
					"/gettourspot" + 
					"?serviceKey=" + "zvlXpYH9ktzxM7siJSmQjLWjpZNRb9NDe9F%2FUIhY2J6UNiRTtEbxFIlHwJTX14BTy1P4NV0FM8NZZhBOLIld6g%3D%3D" +
					"&pageNo=1" +
					"&numOfRows=10";
				
				// 3. fetch() 통해서, api 접속 시도
				fetch(url)
					.then(response => {
						if(response.ok != true){
							throw new Error("API 접속 실패");
						}
						return response.json();	// 검사창 -> NetWork창
					})
					.then(data => {	// 정상 처리된 경우에만 동작
						// 오픈API에 있어 실질적인 데이터 추출
						items = data.response.body.items;
						
						// div에 표현할 내용을 저장할 print 변수값 구성
						print = "";
						items.forEach(item => {		// items 데이터 개수만큼 반복
							print += "<h2>"+item.tourspotNm+"</h2>";
							print += "<p>"+item.tourspotAddr+"</p>";
							print += "<p>"+item.tourspotDtlAddr+"</p>";
							print += "<p>"+item.refadNo+"</p>";
							print += "<hr>";
						})
						
						rs.innerHTML = print;
					})
			}
		</script>
	</body>
</html>
