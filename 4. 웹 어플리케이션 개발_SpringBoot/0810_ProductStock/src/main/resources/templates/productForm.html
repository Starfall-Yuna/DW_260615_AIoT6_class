<html>
	<head>
		<title>상품 재고 폼</title>
	</head>
	<body>
		<h1>재고 관리 프로그램</h1>
		<hr>
		
		<h2>1. 재고 조회</h2>
		<form action="/view" method="post">
			상품ID: 
			<input type="text" name="productId">
			<input type="submit" value="조회" >
			<!-- "조회" 버튼 누르면, localhost:8080/view(post방식)로 이동-->
		</form>
		<hr>
		
		<h2>2. 상품 입고</h2>
		<form action="/plus" method="post">
			상품ID:
			<input type="text" name="productId">	<br>
			입고수량:
			<input type="text" name="amount">
			<input type="submit" value="입고" >
			<!-- "입고" 버튼 누르면, localhost:8080/plus(post방식) 이동-->
		</form>
		<hr>
		
		<!-- 3개의 입력값 기반으로, DB 데이터 삽입 연산 수행-->
		<h2>3. 상품 정보 추가</h2>
		<form action="/add" method="post">
			상품ID: 
			<input type="text" name="productId">	<br>
			상품명:
			<input type="text" name="proName">	<br>
			재고량:
			<input type="text" name="proStock">	<br>
			
			<input type="submit" value="추가">
			<!-- 버튼 누르면, localhost:8080/add(post방식) 이동-->
		</form>
		<hr>
		
		<!-- 입력받은 상품ID에 해당하는 DB 데이터 삭제 연산 수행-->
		<h2>4. 상품 정보 삭제</h2>
		<form action="/remove" method="post">
			상품ID: 
			<input type="text" name="productId">	<br>
			
			<input type="submit" value="삭제">
		</form>
		
	</body>
</html>
