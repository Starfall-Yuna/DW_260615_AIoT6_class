<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<title>책 상세 페이지</title>
	</head>
	<body>
		<!-- data라는 이름으로 bd 리스트 요소를 한쌍씩 확인
			=> 한쌍씩 확인하면서 div 태그 생성 -->
		<div th:each="data: ${bd}">
			<p>
				책번호: <span th:text="${data.book_id}"></span>
			</p>
			<p>
				책이름: <span th:text="${data.name}"></span>
			</p>
			<p>
				가격: <span th:text="${data.price}"></span>원
			</p>
		</div>
	</body>
</html>
