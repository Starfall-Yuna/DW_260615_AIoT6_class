<!-- View :: 사용자가 원하는 데이터를 확인하는 화면 -->
<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<title>책 목록 조회</title>
	</head>
	<body>
		<h2>도서 목록</h2>
		<hr>
		
		<!-- table 태그 :: 표를 표현하는 태그(tr, th, td)-->
		<table border="1">
			<tr>
				<th>책번호</th>
				<th>책이름</th>
			</tr>
			
			<!-- "b에 있는 요소 하나하나를 data 이름으로 확인"
				=> 하나씩 확인하면서 tr 태그 생성 -->
			<tr th:each="data: ${b}">
				<td th:text="${data.book_id}"></td>
				<td>
					<a th:text="${data.name}"
						th:href="@{/book/page(id=${data.book_id})}"></a>
						<!-- "localhost:8080/book/page?id=[값]" -->
				</td>
			</tr>
		</table>
	</body>
</html>
