<html>
	<head>
		<title>계산기</title>
	</head>
	<body>
		<h1>계산기 프로그램입니다</h1>
		<hr>
		
		<!-- post방식의 localhost:8080/execute 탐색-->
		<form action="/execute" method="post">
			<input type="text" id="num1" name="num1">	<!-- num1="입력값" -->
			<select name="oper">
				<option value="plus">+</option>		<!-- oper="plus" -->
				<option value="minus">-</option>	<!-- oper="minus" -->
				<option value="multi">*</option>	<!-- oper="multi" -->
			</select>
			<input type="text" id="num2" name="num2">	<!-- num2="입력값" -->
				
			<input type="submit" value="연산" >
			<!-- "연산" 버튼 누르면 -> "localhost:8080/execute" 실행 -->
		</form>
	</body>
</html>
