<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<title>할일 조회 결과</title>
	</head>
	<body>
		<h1>할일 목록</h1>
		<hr>
		
		<table border="1">
			<tr>
				<th>ID</th>
				<th>카테고리</th>
				<th>내용</th>
				<th>완료여부</th>
			</tr>
			
			<!-- tr태그 alldata의 데이터 수만큼 반복 생성 -->
			<!-- alldata의 크기가 3 => tr태그 3번 생성 -->
			<tr th:each="item: ${alldata}">
				<!-- item :: alldata의 데이터를 순차 확인
					([0]번 데이터 -> [1]번 데이터 -> [2]번 데이터 ...) -->
				<td th:text="${item.id}"></td>
				<td th:text="${item.category}"></td>
				<td th:text="${item.content}"></td>
				<td th:text="${item.completed}"></td>
			</tr>
		</table>
	</body>
</html>
