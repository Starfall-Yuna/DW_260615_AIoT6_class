<html>
	<head>
		<title>로그인 폼</title>
	</head>
	<body>
		<!-- get방식 :: http://localhost:8080/doLogin?id=[입력값]&&pw=[입력값]로 이동-->
		<!-- post방식 :: http://localhost:8080/doLogin로 이동-->
		<form action="/doLogin" method="post">
			아이디: 
			<input type="text" name="id">	<br>
			비밀번호: 
			<input type="password" name="pw">	<br>
			
			<input type="submit" value="로그인" >
			<!-- "localhost:8080/doLogin 링크로 get 방식으로 이동-->
		</form>
	</body>
</html>
