<html xmlns:th="http://www.thymeleaf.org">
	<head>
		<title>게시판 상세 내용</title>
	</head>
	<body>
		<table border="1" th:each="b: ${res}">
			<tr>
				<th>게시판번호</th>
				<td th:text="${b.id}"></td>
			</tr>
			<tr>
				<th>제목</th>
				<td th:text="${b.title}"></td>
			</tr>
			<tr>
				<th>작성자</th>
				<td th:text="${b.writer}"></td>
			</tr>
			<tr>
				<th>내용</th>
				<td th:text="${b.content}"></td>
			</tr>
		</table>
		
		<a href="/board/list">목록으로</a>
	</body>
</html>
