<!--
    1. VsCode 설치 + 테마 변경 + 글씨 크기 변경
    2. html 주석(설명문) + html:5 형식 불러오기
    3. html :: 웹페이지 화면 구성
    4. html 구성 (태그(p, h1~h6, a), 속성(style, href, ...))
-->

<!DOCTYPE html>     <!-- document type(문서 형식) html 정의 -->
<html lang="en">    <!-- "html 문서는 영어로 작성됨"을 정의 -->
<head>      <!-- head 태그 :: html 문서 설정 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>     <!-- title 태그 :: 문서 이름-->
</head>
<body>      <!-- body 태그 :: html 문서 내용 -->
    <!-- - 태그 :: p, h1~h6, a-->
    <!-- h태그 :: 제목 태그-->
    <h1 style="color:blue">AIoT기반 드론 영상 관제시스템 개발</h1>
    <h2>기간: 2026/06/15 ~ 2027/01/07</h2>
    <!-- p태그 :: 본문 태그-->
    <p>자세한 내용은 홈페이지를 참고해주세요</p>
    <!-- a태그 :: 하이퍼링크O 태그 (href 속성 활용)-->
    <a href="https://www.tjdaewoo.co.kr/">학원 홈페이지</a>
</body>
</html>
