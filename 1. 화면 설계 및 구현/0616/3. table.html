<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- table태그 :: 표를 생성하는 공간 마련-->
    <!-- <table>, <tr>, <th>, <td> -->

    <!-- border="1" :: (권장X) 옛날 방식, th td 모든 경계선 값에 관여 -->
    <!-- style="border: 1px solid black" :: 오로지 table 경계선 값에 관여 -->
    <table style="width:80%; border: 1px solid black">
        <!-- <tr>태그 :: table row, 하나의 행(줄) 생성-->
        <tr style="background-color:burlywood">
            <!-- <th>태그 :: table head, 하나의 열(칸) 생성, 그 줄의 데이터 설명-->
            <th>메뉴명</th>
            <th>가격</th>
            <th>만족도</th>
        </tr>
        <tr>
            <!-- <td>태그 :: table data, 하나의 열(칸) 생성, 실질적인 값 삽입-->
            <td>튀김소보루</td>
            <td>2500</td>
            <td>중상</td>
        </tr>
        <tr>
            <td>한정식</td>
            <td>15000</td>
            <td>중간</td>
        </tr>
        <tr>
            <td>초밥</td>
            <td>17000</td>
            <td>높음</td>
        </tr>
        <tr>
            <td>집밥</td>
            <td>-</td>
            <td>높음</td>
        </tr>
    </table>
</body>
</html>
