<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 목록 태그 :: ol, ul, dl(설명X) -->
    <!-- ol태그 :: Ordered List, 순서가 있는 목록 표현-->
    <!-- ul태그 :: Unordered List, 순서가 없는 목록 표현-->
    
    <h3>커피 종류</h3>
    <ul>
        <!-- li태그 :: 목록의 요소 하나하나-->
        <li>아메리카노</li>
        <li>카페라떼</li>
        <li>카푸치노</li>
    </ul>
    <hr>

    <h3>공부할 거</h3>
    <ol>
        <li>
            HTML <br>
            (목록 태그 공부중)
        </li>
        <li>CSS</li>
        <li>JavaScript</li>
    </ol>
</body>
</html>
