<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>취업 준비 페이지</h2>

    <h3>취업 준비 체크리스트</h3>
    <ul>    <!-- ul 태그 :: unordered list, 순서가 없는 리스트 표현 -->
        <!-- li 태그 :: 목록 요소 표현 -->
        <li>이력서 작성하기</li>
        <li>자기소개서 초안 작성하기</li>
        <li>면접 예상 질문 준비하기</li>
    </ul>
    <hr>

    <h3>입사 지원 절차</h3>
    <ol>    <!-- ol 태그 :: ordered list, 순서가 있는 리스트 표현-->
        <li>채용 공고 확인</li>
        <li>
            입사지원
            <!-- 입사지원 안으로 회사 이름 3개를 순서없이 나열한 리스트 항목 추가하기-->
            <ul>
                <li>A회사</li>
                <li>B회사</li>
                <li>C회사</li>
            </ul>
        </li>   
        <li>서류 합격 여부 확인</li>
        <li>면접 진행<span style="color:red">(진행중)</span></li>
        <li>최종 합격 발표</li>
    </ol>
    <hr>
</body>
</html>
