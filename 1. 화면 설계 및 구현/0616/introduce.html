<!DOCTYPE html>     <!-- document type(문서 형식) html 정의 -->
<html lang="en">    <!-- "html 문서는 영어로 작성됨"을 정의 -->
<head>      <!-- head 태그 :: html 문서 설정 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AIoT 드론 영상 관제시스템 개발</title>     <!-- title 태그 :: 문서 이름-->

    <style>
        body {
            margin: 0;
            height: 100vh;
            font-family: 'Segoe UI', 'Pretendard', sans-serif;
            background: linear-gradient(135deg, #e8f5e9, #e3f2fd);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .card {
            width: 600px;
            padding: 40px;
            background-color: white;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.12);
            text-align: center;
        }

        h1 {
            color: #1565c0;
            font-size: 32px;
            margin-bottom: 18px;
        }

        h2 {
            color: #2e7d32;
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 28px;
        }

        p {
            color: #555;
            font-size: 17px;
            margin-bottom: 30px;
        }

        a {
            display: inline-block;
            text-decoration: none;
            background-color: #1565c0;
            color: white;
            padding: 14px 26px;
            border-radius: 999px;
            font-weight: bold;
            transition: 0.3s;
        }

        a:hover {
            background-color: #0d47a1;
            transform: translateY(-3px);
        }
    </style>
</head>
<body>      <!-- body 태그 :: html 문서 내용 -->
    <div class="card">
        <!-- 태그 :: p, h1~h6, a-->
        <h1>AIoT기반 드론 영상 관제시스템 개발</h1>
        <h2>기간: 2026/06/15 ~ 2027/01/07</h2>
        <p>자세한 내용은 홈페이지를 참고해주세요</p>
        <a href="https://www.tjdaewoo.co.kr/">학원 홈페이지</a>
    </div>
</body>
</html>
