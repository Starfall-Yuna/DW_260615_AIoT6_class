<!-- html :: 웹페이지 화면 구성 (html:5 자동 형식 불러오기)-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 1. p, h1~h6, a, "span, br, hr"-->
    <h1>
        하루 <br>   <!-- br태그 :: 줄바꿈-->
        <span style="color: orange">루틴</span>
    </h1>
    <hr>    <!-- hr태그 :: 구분선 추가-->

    <!-- 2. 목록 태그 :: ol, ul-->
    <h3>하루 일정 순서</h3>
    <ol>    <!-- ol태그 :: 순서O 목록 표현-->
        <!-- li태그 :: 목록의 요소 하나하나-->
        <li>아침 먹기</li>
        <li>비타민 먹기</li>
        <li>7시간 이상 취침</li>
        <li>스트레칭</li>
        <li>명상</li>
    </ol>
    <hr>
    
    <h3>오늘 챙길 것</h3>
    <ul>    <!-- ul태그 :: 순서X 목록 표현-->
        <!-- li태그 목록 표현-->
        <li>
            충전기
            <span style="color:red; font-weight:bold">(C타입)</span>
        </li>
        <li>필기구</li>
        <li>물통</li>
        <li>노트북</li>
    </ul>
    <hr>

    <!-- 3. 여백 설정 :: margin, padding-->
    <!-- padding :: border(테두리)-실제로 활용되는 공간 간의 여백 -->
    <!-- margin :: border(테두리)-외부 간의 여백-->
    <h3>오늘의 한 마디</h3>
    <p style="border: 3px solid orange; width: 300px; padding: 20px; margin: 30px">
       노력보다 강한 것은 루틴입니다. 
    </p>
    <hr>

    <!-- <table>, <tr>, <th>, <td> -->
    <!-- 4. table태그 :: 표 생성하는 공간 마련-->
    <table style="border: 1px solid black; width: 70%">
        <!-- caption태그 :: 표 제목 생성-->
        <caption>시간대별 루틴</caption>

        <!-- tr태그 :: 하나의 행(줄) 생성-->
        <tr style="background-color:burlywood">
            <!-- th태그 :: 하나의 열(칸) 생성 (데이터 카테고리 표현)-->
            <th>시간대 루틴</th>
            <th>할일</th>
            <th>완료 여부</th>
        </tr>
        <tr>
            <!-- td태그 :: 하나의 열(칸) 생성 (실질적인 데이터 표현)-->
            <td>아침</td>
            <td>분리수거</td>
            <td>완료</td>
        </tr>
        <tr>
            <td>저녁</td>
            <td>설거지</td>
            <td>예정</td>
        </tr>
        <tr>
            <td>밤</td>
            <td>휴대폰 충전</td>
            <td>예정</td>
        </tr>
    </table>
</body>
</html>
