<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="font-size: 30px">
    <!-- div, span 모두 영역 분할/요소 그룹화 사용 -->
    <!-- div를 많이 씀 (중첩) -->

    <!-- div태그 :: 세로는 필요한만큼, 가로는 브라우저 너비 전체 차지 (너비 지정O)-->
    <!-- span태그 :: 가로, 세로 모두 필요한만큼 차지 (너비 지정X)-->
    <div style="background-color: aqua; width: 300px;">첫번째 div입니다.</div>
    <div style="background-color: coral">두번째 div입니다.</div>
    <div style="background-color: lightseagreen">세번째 div입니다.</div>
    <hr>
    <span style="background-color: aqua; width: 300px;">첫번째 span입니다.</span>
    <span style="background-color: coral">두번째 span입니다.</span>
    <span style="background-color: lightseagreen">세번째 span입니다.</span>
    <!-- div, span 다른 이유 -> display 속성값 상이 -->
</body>
</html>
