<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- 1. audio, video -->

    <h1>회원가입 폼</h1>
    <hr>
    
    <!-- 2. input-->
    <!-- input태그 :: 입력란 생성 ("type값에 따라 입력 형태 달라짐")
    (password, text, button, submit, reset, checkbox, radio, date, file, range)
        type 별도로 지정X -> 자동으로 type="text" 지정
        placeholder :: 입력에 대한 설명문 -->
    <p>
        <label>이름: </label>
        <input style="width: 200px; background-color:bisque;" 
            placeholder="이름을 입력하세요">
    </p>
    <p>
        <label>아이디: </label>
        <input type="text" placeholder="아이디를 입력하세요">
    </p>
    <p>
        <label>비밀번호: </label>
        <input type="password" placeholder="비밀번호를 입력하세요">
    </p>
    <p>
        생년월일: <input type="date">
    </p>
    <p>
        프로필 사진: <input type="file">
    </p>
    <p>
        <!-- type="radio", 단일 선택 지원
            name 동일하게 설정 -> 하나의 카테고리임을 명시
            <label> for속성 = <input> id속성 연결-->
        <label>성별: </label>
        <input type="radio" id="남성" name="gender" value="남성"> 
        <label for="남성">남성</label>
            <!-- 체크하면, gender값이 "남성"-->
        <input type="radio" id="여성" name="gender" value="여성"> 
        <label for="여성">여성</label>
            <!-- 체크하면, gender값이 "여성"-->
    </p>
    <p>
        <label>관심 분야: </label>
        <input type="checkbox" id="game" name="job">
        <label for="game">게임 개발</label>
        <input type="checkbox" id="web" name="job">
        <label for="web">웹 개발</label>
        <input type="checkbox" id="iot" name="job">
        <label for="iot">IoT 개발</label>
        <input type="checkbox" id="ai" name="job">
        <label for="ai">AI 개발</label>
    </p>
    <p>
        <!-- select태그 :: 여러 선택지 중 선택하여 입력 -->
        <label>전화번호: </label>
        <select>    <!-- 000 - 000 - 0000 -->
            <!-- option태그로 선택지 추가 -->
            <!-- optgroup태그 :: 선택지 그룹화-->
            <option>02</option>
            <option>041</option>
            <option>042</option>
            <option>053</option>
            <option>054</option>
        </select> -
        <input style="width:30px"> -
        <input style="width:30px">
    </p>
    <p>
        <!-- textarea태그 :: 장문의 입력O-->
        <label>자기소개: </label>   <br>
        <textarea rows="10" cols="40" placeholder="자유롭게 입력해주세요">
            안녕하세요. 000입니다. 
        </textarea>
    </p>
</body>
</html>
