<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        h1{
            border: 3px solid brown;
            color: brown;
            width: 400px;
            text-align: center;
            padding: 10px;
        }
        div{
            background-color:bisque;
            padding: 10px;
            width: 350px;
            margin: 20px;
        }
        hr{
            border: 3px solid white;
        }
        .coffee{
            border: 2px solid brown;
        }
        .milk{
            border: 2px solid green;
        }
    </style>
</head>
<body>
    <h1>메뉴판</h1>

    <div class="coffee">
        <h3>아메리카노</h3>
        <hr>
        <p>깔끔하고 진한 기본 커피</p>
    </div>
    <div class="coffee">
        <h3>카페라떼</h3>
        <hr>
        <p>부드러운 우유가 들어간 커피</p>
    </div>
    <div class="milk">
        <h3>고구마라떼</h3>
        <hr>
        <p>고구마가 가득</p>
    </div>
    <div class="milk">
        <h3>녹차라떼</h3>
        <hr>
        <p>녹차의 풍미가 가득</p>
    </div>
</body>
</html>
