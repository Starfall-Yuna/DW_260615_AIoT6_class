<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* CSS (웹페이지 화면 디자인) */
    </style>
</head>
<body>
    <!-- HTML (웹페이지 화면 구성) -->

    <script>
        // JavaScript (웹페이지 동작 구현)
        /* 여러 줄 주석 */

        // 1) Js 출력문 (3가지)
        //      * alert() :: 경고창 출력
        alert("출력문1");
        //      * console.log() :: 콘솔창 출력
        console.log("출력문2");
        //      * document.write() :: 웹페이지(HTML 문서) 출력
        document.write("출력문3");

        // 내부 Js :: .html 파일 안에, <script> 태그 안으로 정의하는 Js
        // 외부 Js :: 별도의 .js 파일을 .html 파일에 불러오기

        // 변수, 상수, 자료형(number, string('', ""), boolean)
        // * 변수(let) :: 값을 저장하는 공간(메모리)         (값 변경O)
        // * 상수(const) :: "고정된" 값을 저장하는 공간(메모리) (값 변경X)
        
        // (let) [변수이름] = [값]  (let 생략 가능)
        // const [상수이름] = [값]
        const name = "Lee";
            // let :: 메모리 공간 생성 
            // name :: 이 공간의 이름을 "name"으로 설정
            // = "Lee" :: "Lee" 값을 왼편의 공간에 대입
        let favo = 5;

        // [기존에_만들어진_공간이름] = [변경할_값]
        // name = "Lyn";       // name 공간의 값을 "Lyn" 값으로 변경 (상수, 값 변경 에러)
        console.log(`이름: ${name}`);
        console.log(`좋아하는 숫자: ${favo}`);
    </script>

    <script src="alert.js"></script>
    <!-- 외부 Js 실행되면, 아래처럼 실행
    <script>
        alert("외부 Js로 실행됩니다.");
    </script>
    -->
</body>
</html>
