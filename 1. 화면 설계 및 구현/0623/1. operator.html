<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // * 연산자 (기능을 수행하는 기호)
        // - 산술연산자 :: +, -, *, /(나눗셈), %(나머지)
        // - 대입연산자 :: = (우측의 값을 좌측의 공간에 대입한다.)
        //      산술연산자 + 대입연산자 -> 복합 대입연산자

        let test=0;
        console.log("test의 값: " +test)
        
        test += 5;        // test에 5를 더하여 값을 갱신하라.
            // "test = test + 5;" 구문과 동일
            // 우측의 test :: 0 값
            // 좌측의 test :: test라는 이름의 변수 공간
            //  => 값[test의 값에 5를 더한 결과]를, 공간[test]에 대입
        console.log("test의 값: " +test);
        
        test *= 6;
        console.log("test의 값: " +test);
        test -= 10;
        console.log("test의 값: " +test);

        test %= 3;      // % :: 나누기 나머지 연산자
        console.log("test의 값: " +test);

        // 증감연산자 :: ++(1 증가), --(1 감소)
        test++;
        console.log("test의 값: " +test);
        test--;
        console.log("test의 값: " +test);

        // 비교연산자
        // 논리연산자
        // 진위형(true, false)
        console.log(5>0 && 6<10);   // -> 결과 확인하고, 원인 파악
    </script>
</body>
</html>
