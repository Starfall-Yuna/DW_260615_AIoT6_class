<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 1) 2개의 숫자 입력을 받으시오. 
        let num1 = Number(prompt("첫번째 숫자 입력"))
        let num2 = Number(prompt("두번째 숫자 입력"))

        // 2) 2개 숫자 크기를 비교하고 아래와 같이 결과 출력하시오.
	    // - 같은 경우. "===" 출력
        if(num1 === num2){      // 두 숫자가 같다면,
            document.write("===");
        }
	    // - 첫째 값이 더 큰 경우. ">" 출력
        else if(num1 > num2){
            document.write(">");
        }
	    // - 둘째 값이 더 큰 경우. "<" 출력
        else {
            document.write("<");
        }

        // if - if - if :: 독립적으로 작동, 3개를 모두 비교하며 실행
        // if - else if - else :: 
        //      조건문들을 하나로 묶어서, 이들 중 하나만 실행
    </script>
</body>
</html>
