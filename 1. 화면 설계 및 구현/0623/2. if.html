<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 진위형(true, false)
        // 비교연산자 :: <, >, >=, <=, ===(같다), !==(다르다)
        // 논리연산자 :: 
        //      &&(그리고) -> 2개의 식이 모두 만족해야 true 제시
        //      ||(또는) -> 2개의 식 중 하나라도 만족하면 true 제시
        console.log(5>0 && 6<10);
            // "5는 0보다 크고, 6은 10보다 작다."   -> 식1 결과 :: true
        console.log(5>0 || 6<10);
            // "5는 0보다 크거나, 6은 10보다 작다." -> 식2 결과 :: true

        // 조건문(if) :: "만약에 ~한다면", 특정 조건을 만족할 때에만 실행
        //      + else if :: 위 조건을 만족하지 않고 else if의 조건을 만족할 때에만 실행
        //      + else :: "~하지 않다면", 위 조건을 만족하지 않을 때 실행
        //          if -> (else if -> else)
        // if(조건식){
        //     조건 만족할 시 수행할 명령문들
        // }

        let name = prompt("이름 입력");
        let ok = confirm("이대로 출력하겠습니까?");
            // ok의 예상값 :: true(확인), false(취소)

        if(ok === true && name !== ""){  
                // ok의 값이 true이고, name 값이 ""이 아닐때  (만족X, 실행X)
            document.write(`이름: ${name}`)
        }
        else if(ok === true && name === ""){
            // 위 조건을 만족하지 못하고, ok가 true이고 name이 ""일 때
            document.write("이름이 입력되지 않았습니다.")
        }
        else{   // 위 조건들을 모두 만족하지 못할 때
            document.write("정상적으로 종료되지 않았습니다.")
        }
    </script>
</body>
</html>
