<!-- html:5 형식 불러오기 -->

<!-- html :: HyperText Markup Language, 웹페이지 화면 구성/표현 -->
<!-- 
    html 구성 :: 
    태그(<>, 표현하는 요소, 시작태그-끝태그 쌍을 이루어야 함),
    속성(설정값, 시작태그 안으로 설정된 값)
-->

<!DOCTYPE html>
<html lang="ko">
<head>  <!-- head 태그 :: html 문서 설정 -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>  <!-- body 태그 :: 웹페이지 내용 작성 -->
    <!-- 인라인 스타일 적용은 아래처럼 -->
    <h1 style="color:blue">성장하는 신입, 000입니다.</h1>      <!-- heading, 제목 -->
    <p>잘 부탁드립니다.</p>             <!-- paragragh, 본문 -->
</body>
</html>
