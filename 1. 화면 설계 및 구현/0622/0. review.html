<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 선택자(selector) :: html 문서의 일부 "태그 선택"하는 문법 */
        /* 1. 속성 선택자([]) :: 
                "특정 속성=특정 속성값" 만족하는 태그 선택 */
        [type="text"]{      /* 태그들 중, type="text"인 태그 선택 */
            background-color:lightcyan;
        }
        input[type="password"]{     /* input 태그들 중, type="password"인 태그 선택 */
            background-color:mistyrose;
        }

        /* 2. 부정 선택자(:not()) ::
                "~이 아니다", 특정 조건에 반대되는 태그 선택 (0619 파일 참고)*/

        /* 3. 반응 선택자 :: 특정 태그에 대해, 사용자 동작에 반응하는 스타일 지정
                - :hover :: 태그 위에 마우스를 올렸을 때 반응
                - :active :: 태그를 마우스로 꾹 눌렀을 때 반응
        */
        #button{
            background-color: bisque;
        }
        #button:hover{
            background-color: coral;
        }
        #button:active{
            background-color: indianred;
        }

        /* 4. 후손/자식 선택자
            - 후손 선택자(A B) :: "A 안에 존재하는 모든 B를 선택"
            - 자식 선택자(A>B) :: "A의 바로 아래에 있는 B를 선택"
        */
        form label{
            color:crimson; 
        }
        form>label{
            color:darkgreen;
        }

        /* 5. 상태 선택자 :: 태그의 상태에 따라 스타일 지정
            - :focus :: 선택된 상태인 입력 태그를 선택
            - :checked :: 체크 상태인 (체크박스/라디오) 태그를 선택
            - :enabled :: 사용 가능한 입력 태그 선택
            - :disabled :: 사용 불가능한 입력 태그 선택
                (태그에 disabled="disabled" 속성 추가하고 결과 확인)
        */
        input:focus{
            border: 3px solid blue;
            outline: none;
        }
        input:checked + label{
            /* "체크 상태인 input" 태그에 있어, 바로 뒤에 있는(+) label 선택 */
            font-weight: bold;
        }

        /* (기타) 동위선택자, 구조선택자, 링크선택자, 문자선택자, ...*/
    </style>
</head>
<body>
    <h1>로그인 폼</h1>
    <hr>

    <form>
        <div>
            <!-- id, pw 입력 태그 :: form 태그의 후손-->
            <label>아이디: </label>
            <input type="text" >    <br>
            <label>비밀번호: </label>
            <input type="password" >    <br>
        </div>

        <!-- checkbox, submit 입력 태그 :: form 태그의 자식 -->
        <input type="checkbox" >
        <label>약관에 동의합니다.</label>   <br>
        
        <input type="submit" value="로그인" id="button">
    </form>
</body>
</html>
