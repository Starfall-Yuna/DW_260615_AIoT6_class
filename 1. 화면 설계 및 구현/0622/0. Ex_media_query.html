<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        p{
            width: 100px;
            height: 100px;
            border: 2px solid black;
            text-align: center;
            background-color: white;
        }

        /* 반응형 웹앱 :: 브라우저 크기에 따라서 표현하는 웹페이지를 다르게 반응 
            미디어 쿼리 :: 반응형 웹앱의 주축 */
        @media screen and (min-width: 500px){
            /* 브라우저 너비값이 최소 500px일 때 (500px 이상),
                #first 태그의 배경색 변경 */
            #first{background-color: red;}
        }
        @media screen and (min-width: 600px){
            #second{background-color: orange;}
        }
        @media screen and (min-width: 700px){
            #third{background-color: yellow;}
        }
        @media screen and (min-width: 800px){
            #fourth{background-color: green;}
        }
        @media screen and (min-width: 900px){
            #fifth{background-color: blue;}
        }
        @media screen and (min-width: 1000px){
            p{color:white;}
        }
    </style>
</head>
<body>
    <p id="first">1st p 태그</p>
    <p id="second">2nd p 태그</p>
    <p id="third">3rd p 태그</p>
    <p id="fourth">4th p 태그</p>
    <p id="fifth">5th p 태그</p>
</body>
</html>
