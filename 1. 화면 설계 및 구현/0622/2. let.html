<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 변수(let, var) :: 값을 저장하는 공간

        // 변수 생성+초기값 설정(초기화) :: 
        //      => let [변수명] = [초기값];
        let name = "Lee";
            // name이라는 이름을 가지고, "Lee"라는 값을 가지는 변수 공간 생성
        let gender = "여성";
        let number = 5;

        // 값 변경 ::
        //      [기존에_만들어진_변수이름] = [변경할_값];
        name = "Lyn";
            // 기존에 있는 name 변수 값을 "Lyn"으로 변경

        console.log(`이름: ${name}`);
        console.log(`성별: ${gender}`);
        console.log(`좋아하는 숫자: ${number}`);
    </script>
</body>
</html>
