<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        // 상수(const) :: "고정된" 값을 저장하는 공간  -> 값 변경X
        const PI = 3.14;
        // PI = 1.11;      // "상수에 값을 할당하였다." 에러 발생

        // 원의 반지름 값을 저장하는 변수 r 생성 + 임의의 값을 설정
        let r = 5;

        // 변수 r과 PI를 통한, 원의 넓이를 출력하세요.
        alert(`원의 넓이: ${r*r*PI}`);
        document.write(`원의 넓이: ${r*r*PI}`);
        console.log(`원의 넓이: ${r*r*PI}`);
    </script>
</body>
</html>
