<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script> 
        // * 6/23 연산자, 조건문
        
        // 1. 성적(1개의 숫자) 입력을 받으시오
        let score = Number(prompt("성적 입력"))

        // * 연산자 
        // - 비교연산자 :: <, >, <=, >=, ===(같다), !==(다르다)
        // - 논리연산자 :: &&(그리고), ||(또는), !(~아니다)

        // 조건문(1) :: if - else if - else
        document.write("if문으로 작성: ");
        if(90<=score && score<=100) { document.write("A"); }
        else if(80<=score && score<90) { document.write("B"); }
        else if(70<=score && score<80) { document.write("C"); }
        else if(60<=score && score<70) { document.write("D"); }
        else { document.write("F"); }
        document.write("<br>");

        // [ 위의 기능을 switch문으로 변환 ]

        // * 연산자(2)
        // - 산술연산자 :: +, -, *, /, %(나머지)
        // - 대입연산자 :: =
        //      => 산술연산자+대입연산자 -> 복합 대입연산자

        // / (나눗셈 연산자), 소수점 아래 내림 함수
        //  - 80~89 / 10 = (몫)8
        //  - 70~79 / 10 = (몫)7
        //  - 60~69 / 10 = (몫)6
        score /= 10;                // 기존의 score값에 10을 나눈 값으로 갱신하라
        score = parseInt(score);    // score값에 소수점 아래를 없앤 값으로 갱신하라.

        document.write("switch문으로 작성: ");
        switch(score){
            case 10:    // 입력값 :: 100
            case 9:     // 입력값 :: 90~99
                document.write("A");    break;
            case 8:     // 입력값 :: 80~89
                document.write("B");    break;
            case 7:
                document.write("C");    break;
            case 6:
                document.write("D");    break;
            default:
                document.write("F");
        }   // break; 만나면, switch {} 구문 탈출
    </script>
</body>
</html>
