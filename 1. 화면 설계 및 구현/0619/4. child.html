<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 후손 선택자( ) :: 특정 태그(A) 안에 있는 태그(B) 선택
            "A 안에 존재하는 모든 B를 선택" */
        div p{  /* div 안에 존재하는 모든 p를 선택 */
            color:darkcyan;
        }

        /* 자식 선택자(>) :: 특정 태그(A) "바로" 안에 있는 태그(B) 선택
            "A 안으로 바로 드러나는 B를 선택" */
        div>p{
            background-color:burlywood;
        }
    </style>
</head>
<body>
    <div>   <!-- div 위치-->
        <span>
            <p>div 안의 span 안의 p 태그</p>    <!-- div p 스타일 적용-->
        </span>
        <p>div 안의 p 태그</p>  <!-- div p, div>p 스타일 모두 적용-->
    </div>
</body>
</html>
